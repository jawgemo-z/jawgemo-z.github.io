# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: jawgemo
subtitle: 每天记一点，慢慢就厚了。
description: 一个用来存放日常想法的地方
keywords: 随笔, 想法, 日记
author: 我
language: zh-CN
timezone: Asia/Shanghai

# URL
## 部署后把这里换成你的真实地址，例如 https://yourname.github.io
url: https://keyanzhang491-boop.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: false
  line_number: false
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 12
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: 'date'

# Pagination
per_page: 12
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: ink

# RSS
feed:
  type: atom
  path: atom.xml
  limit: 20

# Deployment
deploy:
  type: ''
